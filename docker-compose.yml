# Backend del marketplace con PostgreSQL.
#
#   cp .env.example .env      # y complete los valores
#   docker compose up -d --build
#
# Las credenciales se leen de .env (no se versiona). La base se alcanza por el
# nombre del contenedor (db-postgres) dentro de la red de Docker.
services:
  backend:
    build:
      context: .
      dockerfile: ./DockerFile
    env_file: .env
    environment:
      DB_HOST: db-postgres
      DB_DIALECT: postgres
    depends_on:
      - db-postgres
    ports:
      - "${API_PORT:-8080}:${PORT:-3020}"
    volumes:
      - uploads_data:/usr/src/app/uploads

  db-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-marketplace}
      POSTGRES_USER: ${DB_USER:-marketplace}
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5555}:5432"

volumes:
  postgres_data:
  uploads_data:
